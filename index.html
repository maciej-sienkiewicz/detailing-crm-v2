<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout
         viewport instead of sliding it, so position:fixed chrome (mobile bottom nav,
         modal footers) stays glued to the bottom edge while typing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- PWA: manifest + icons are REQUIRED for iOS Web Push — Safari only allows
         push subscriptions from a PWA installed via "Add to Home Screen". -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>automotive-crm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
