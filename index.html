<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikona w zakładce: sygnet „D" z paczki marki. SVG sam przełącza się na jasny
         znak przy ciemnym motywie przeglądarki; .ico i PNG są dla przeglądarek bez
         ikon SVG (Safari). -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=3" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout
         viewport instead of sliding it, so position:fixed chrome (mobile bottom nav,
         modal footers) stays glued to the bottom edge while typing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- PWA: manifest + icons are REQUIRED for iOS Web Push - Safari only allows
         push subscriptions from a PWA installed via "Add to Home Screen".

         The manifest is served per studio (backend: PwaManifestController), so the
         attribution line every browser stamps on a notification - "from X" - names
         the user's own company instead of the product. crossorigin="use-credentials"
         is what makes that possible at all: without it the browser fetches the
         manifest with no cookies and the backend cannot tell one studio from
         another. The name is captured at install time, so it follows whoever was
         logged in when the app was added to the home screen. -->
    <link rel="manifest" href="/api/v1/pwa/manifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <title>DetailBoost</title>
    <!-- Podgląd linku (Facebook, WhatsApp, Messenger, Slack, X). Statycznie, bo roboty
         nie uruchamiają JavaScriptu; og:image musi być pełnym adresem. -->
    <meta name="description" content="DetailBoost: CRM dla studiów auto detailingu. Kalendarz, przypomnienia SMS, protokoły przyjęcia, faktury w KSeF i baza klientów w jednym systemie." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DetailBoost" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:url" content="https://detailboost.pl/" />
    <meta property="og:title" content="DetailBoost" />
    <meta property="og:description" content="CRM dla studiów auto detailingu. Kalendarz, przypomnienia SMS, protokoły przyjęcia, faktury w KSeF i baza klientów w jednym systemie." />
    <meta property="og:image" content="https://detailboost.pl/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo DetailBoost" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://detailboost.pl/twitter-card.png" />
    <!-- Weryfikacja domeny detailboost.pl w Meta Business (Facebook). Musi stać w statycznym
         <head> strony głównej - tag dopisany przez JavaScript weryfikacji nie przechodzi. -->
    <meta name="facebook-domain-verification" content="5thjuozdxttknk2eioi6elfpzd6kwh" />
    <!-- Ekran startowy. Do niedawna przez cały czas wczytywania kodu i sprawdzania
         sesji ekran był biały: #root był pusty, a tło <body> ustawia dopiero
         JavaScript. Ten fragment maluje się w chwili przyjścia HTML-a. React
         podmienia go przy pierwszym renderze na <BootSplash> o tych samych klasach
         (src/core/components/BootSplash.tsx), więc dalsze oczekiwanie na sesję
         i trasę wygląda tak samo, bez mignięcia. Style są tutaj, a nie w CSS
         z bundla, bo mają działać, zanim ten CSS przyjdzie.

         W zainstalowanej aplikacji (display-mode: standalone) tło jest ciemne jak
         background_color z manifestu - przejście z systemowego ekranu powitalnego
         jest wtedy niewidoczne. W karcie przeglądarki jasne jak tło aplikacji. -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #eef2f7;
      }
      .boot-splash__icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      }
      .boot-splash__bar {
        position: relative;
        width: 56px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(15, 23, 42, 0.1);
      }
      .boot-splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: #0ea5e9;
        animation: boot-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (display-mode: standalone) {
        .boot-splash { background: #0f172a; }
        .boot-splash__icon { box-shadow: none; }
        .boot-splash__bar { background: rgba(255, 255, 255, 0.12); }
      }
      .boot-legal {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 2;
        margin: 0;
        font: 11px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        color: rgba(15, 23, 42, 0.45);
      }
      .boot-legal strong { font-weight: 500; }
      .boot-legal__ids { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; }
      @media (display-mode: standalone) {
        .boot-legal { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__bar::after { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Wczytywanie DetailBoost">
        <img class="boot-splash__icon" src="/icons/icon-192.png?v=3" alt="" width="72" height="72" />
        <span class="boot-splash__bar"></span>
      </div>
      <!-- Dane spółki w STATYCZNYM HTML-u (art. 206 KSH). Weryfikacja firmy w Meta szuka
           oficjalnej nazwy w witrynie i nie uruchamia JavaScriptu - stopka logowania
           rysowana przez Reacta była dla niej niewidoczna i weryfikację odrzucano.
           React zdejmuje ten blok przy pierwszym renderze razem z ekranem startowym.
           Źródło i strażnik zgodności: src/core/companyLegal.ts (+ .test.ts). -->
      <footer class="boot-legal">
        <strong>M&amp;M SOLUTIONS SPÓŁKA Z OGRANICZONĄ ODPOWIEDZIALNOŚCIĄ</strong>
        <div>ul. Poznańska 119, 60-185 Skórzewo</div>
        <div>Sąd Rejonowy Poznań – Nowe Miasto i Wilda w Poznaniu, VIII Wydział Gospodarczy KRS</div>
        <div class="boot-legal__ids"><span>KRS 0001267442</span><span>NIP 7773476300</span><span>REGON 545750800</span></div>
        <div>Kapitał zakładowy 40 000,00 zł</div>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
