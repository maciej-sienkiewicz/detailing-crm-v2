<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikona w zakładce: znak DetailBoost na czarnym kafelku. Dwa rozmiary, bo
         przeglądarka wybiera bliższy docelowemu - 32 px ma znak sięgający niemal
         krawędzi (w zakładce liczy się każdy piksel), 192 px oddycha tak jak
         ikona na ekranie głównym. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout
         viewport instead of sliding it, so position:fixed chrome (mobile bottom nav,
         modal footers) stays glued to the bottom edge while typing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- PWA: manifest + icons are REQUIRED for iOS Web Push - Safari only allows
         push subscriptions from a PWA installed via "Add to Home Screen".

         The manifest is served per studio (backend: PwaManifestController), so the
         attribution line every browser stamps on a notification - "from X" - names
         the user's own company instead of the product. crossorigin="use-credentials"
         is what makes that possible at all: without it the browser fetches the
         manifest with no cookies and the backend cannot tell one studio from
         another. The name is captured at install time, so it follows whoever was
         logged in when the app was added to the home screen. -->
    <link rel="manifest" href="/api/v1/pwa/manifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>DetailBoost</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
