server {
    listen       80;
    server_name  localhost;

    # Serve index.html without caching to ensure latest version
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Service Workers: NEVER cache. Their filenames are stable (no content
    # hash), so the 1-year immutable rule below would match them and pin every
    # browser to the worker it first downloaded - a fixed bug would not reach
    # anyone's phone. That already happened once with /sw.js, which is why the
    # worker had to be renamed to escape the poisoned cache entries.
    # Regex locations are tried in order, so this block claims the worker
    # scripts before the *.js rule underneath can.
    location ~ ^/(service-worker|sw|logo-sw)\.js$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Click-to-Call handoff page - stable filename, same reasoning as /sw.js.
    location = /call.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets (JS, CSS) with versioned filenames for 1 year.
    # .mjs to też JavaScript (moduły ES, m.in. worker pdf.js), ale stockowy mime.types
    # nginx zna tylko .js: bez własnej mapy .mjs szło jako application/octet-stream,
    # przeglądarka odrzucała taki moduł i każdy PDF (lista obecności, strona podpisu
    # z SMS-a) kończył się „Nie udało się wyświetlić dokumentu". `types` w bloku
    # location zastępuje mapę odziedziczoną, dlatego wymienia wszystkie trzy rozszerzenia.
    location ~* \.(m?js|css)$ {
        root   /usr/share/nginx/html;
        types {
            application/javascript js mjs;
            text/css               css;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Default location for SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pusta wartość = nagłówek NIE trafia do backendu, także gdy przysłał go klient.
        # Pod adresem aplikacji żądanie nigdy nie udaje żądania z okna podglądu roli.
        proxy_set_header X-Role-Preview-Host "";
        proxy_cache_bypass $http_upgrade;
    }

    # STOMP over SockJS endpoint - without this block the SPA fallback
    # (try_files → index.html) answers the SockJS handshake with HTML and
    # real-time notifications never work in production.
    location /ws-registry {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Role-Preview-Host "";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        # Long-lived connection: STOMP heartbeats run every 10s, so a 90s
        # read timeout tolerates several missed beats without cutting a
        # healthy socket, while dead sockets are still reaped.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

# ── Podgląd roli: podglad.<domena> (produkcja) i podglad-<cokolwiek>.<domena> (develop) ──
# Ta sama aplikacja i ten sam backend, osobny adres. Administrator otwiera tu CRM oczami
# pracownika z daną rolą, na jednorazowej piaskownicy z danymi przykładowymi. Osobny host,
# bo ciasteczko sesji jest przypisane do hosta: sesja piaskownicy nie może nadpisać sesji
# administratora pod adresem aplikacji, a sesja administratora nie działa tutaj.
#
# Backend rozpoznaje adres podglądu WYŁĄCZNIE po nagłówku X-Role-Preview-Host: 1 i wiąże
# z nim sesje piaskownic. Nagłówek dopisuje proxy, które przekazuje /api i /ws-registry do
# backendu:
#   - na produkcji nginx-proxy-manager kieruje /api i /ws-registry prosto do kontenera
#     backendu, z pominięciem tego pliku - tam, w lokalizacjach /api i /ws-registry hosta
#     podglad.*, trzeba dopisać: proxy_set_header X-Role-Preview-Host "1";
#   - gdy /api idzie przez ten plik, robią to bloki location niżej.
# Ten blok odpowiada za część statyczną: bez service workera, ramka tylko z tego adresu,
# bez indeksowania. Proxy przed kontenerem musi zachować nagłówek Host (NPM to robi),
# inaczej blok się nie dopasuje. W backendzie: ROLE_PREVIEW_ENABLED=true
# i ROLE_PREVIEW_BASE_URL=https://podglad.detailboost.pl.
server {
    listen       80;
    server_name  ~^podglad[.-];

    # Okno podglądu osadza aplikację w ramce - wyłącznie z tego samego adresu.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # add_header w bloku location wyłącza dziedziczenie nagłówków z poziomu server -
    # dlatego nagłówki bezpieczeństwa są powtórzone przy HTML-u.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Bez service workera: piaskownica znika po wyjściu z podglądu, a worker przeżyłby ją,
    # trzymałby jej dane w pamięci podręcznej i mógłby zapisać się na powiadomienia push.
    location ~ ^/(service-worker|sw|logo-sw)\.js$ {
        return 404;
    }

    # .mjs jako JavaScript - patrz komentarz przy tej samej regule wyżej.
    location ~* \.(m?js|css)$ {
        root   /usr/share/nginx/html;
        types {
            application/javascript js mjs;
            text/css               css;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Role-Preview-Host "1";
        proxy_cache_bypass $http_upgrade;
    }

    location /ws-registry {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Role-Preview-Host "1";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
