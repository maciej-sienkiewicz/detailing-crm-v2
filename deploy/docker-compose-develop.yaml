# Jawna nazwa projektu Compose. Bez niej projekt bierze nazwę z katalogu
# (/opt/apps/{env}/app-frontend → "app-frontend" dla OBU środowisk), przez co
# deploy develop z --remove-orphans usuwałby kontener produkcyjnego frontendu
# (inny klucz serwisu w tym samym projekcie = "osierocony").
name: app-frontend-develop

services:
  detailing-crm-frontend-develop:
    image: ${ENV_DETAILING_CRM_FRONTEND_IMAGE}
    container_name: ${DETAILING_CRM_FRONTEND_CONTAINER_NAME}
    ports:
      - '${ENV_DETAILING_CRM_FRONTEND_EXTERNAL_PORT}:80'

    restart: always
    networks:
      - network


networks:
  network:
    name: ${ENV_NETWORK}
    external: true

